<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="thanks_meta_title">Messaggio inviato | Paul</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#c74f00" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="settings-bar">
      <button
        type="button"
        class="settings-btn"
        data-language-toggle
        aria-label="Cambia lingua: passa all'inglese"
        data-i18n-attr="aria-label:lang_toggle"
      >
        <svg class="icon" aria-hidden="true" focusable="false">
          <use href="/icons.svg#globe"></use>
        </svg>
        <span data-language-label>IT</span>
      </button>
      <button
        type="button"
        class="settings-btn"
        data-theme-toggle
        aria-label="Attiva il tema scuro"
      >
        <svg class="icon icon--moon" aria-hidden="true" focusable="false">
          <use href="/icons.svg#moon"></use>
        </svg>
        <svg class="icon icon--sun" aria-hidden="true" focusable="false">
          <use href="/icons.svg#sun"></use>
        </svg>
      </button>
    </div>

    <main class="thanks">
      <h1 class="thanks__title" data-i18n="thanks_title">Messaggio inviato!</h1>
      <p class="thanks__text" data-i18n="thanks_text">
        Grazie per avermi scritto, ti risponderò il prima possibile.
      </p>
      <a class="btn" href="/" data-i18n="thanks_back">Torna alla home</a>
    </main>
  </body>
</html>
